apiVersion: v1
kind: ConfigMap
metadata:
  name: skyline-rush-config
  namespace: skyline-rush-prod
  labels:
    app.kubernetes.io/name: skyline-rush
data:
  NODE_ENV: "production"
  PORT: "3000"
  REDIS_URL: "redis://redis-service.skyline-rush-prod.svc.cluster.local:6379"
  LOG_LEVEL: "info"
  RATE_LIMIT_GENERAL_RPM: "60"
  RATE_LIMIT_PURCHASE_RPM: "10"
  METRICS_ENABLED: "true"
