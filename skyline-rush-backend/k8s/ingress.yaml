apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skyline-rush-ingress
  namespace: skyline-rush-prod
  labels:
    app.kubernetes.io/name: skyline-rush-backend
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-rps: "60"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
spec:
  tls:
    - hosts:
        - api.skylinerush.game
      secretName: skyline-rush-tls-cert
  rules:
    - host: api.skylinerush.game
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skyline-rush-backend-service
                port:
                  number: 80
