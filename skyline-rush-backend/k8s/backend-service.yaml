apiVersion: v1
kind: Service
metadata:
  name: skyline-rush-backend-service
  namespace: skyline-rush-prod
  labels:
    app.kubernetes.io/name: skyline-rush-backend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: skyline-rush-backend
