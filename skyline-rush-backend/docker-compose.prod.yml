version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: skyline-rush-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skylinerush_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skylinerush_prod_secret_vault_2026}
      POSTGRES_DB: ${POSTGRES_DB:-skylinerush_prod_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./libs/db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skylinerush_prod} -d ${POSTGRES_DB:-skylinerush_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: skyline-rush-redis-prod
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru", "--requirepass", "${REDIS_PASSWORD:-redis_prod_secret_vault_2026}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_prod_secret_vault_2026}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyline-rush-gateway-prod
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      POSTGRES_URL: postgresql://${POSTGRES_USER:-skylinerush_prod}:${POSTGRES_PASSWORD:-skylinerush_prod_secret_vault_2026}@postgres:5432/${POSTGRES_DB:-skylinerush_prod_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_prod_secret_vault_2026}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-prod_super_secure_vault_jwt_key_2026}
      REFRESH_SECRET: ${REFRESH_SECRET:-prod_super_secure_vault_refresh_key_2026}
      PARENTAL_GATE_SECRET: ${PARENTAL_GATE_SECRET:-prod_super_secure_vault_gate_key_2026}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M

  nginx:
    image: nginx:1.25-alpine
    container_name: skyline-rush-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  postgres_prod_data:
  redis_prod_data:
